workflows:
  ios-release:
    name: iOS App Store release
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key added in Codemagic
      # (Team settings → Integrations → App Store Connect).
      app_store_connect: codemagic-asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lifekit.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Use signing profiles
        script: xcode-project use-profiles

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed IPA
        # Every upload needs a higher build number; Codemagic's counter does that.
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ukwenzyb@gmail.com
        notify:
          success: true
          failure: true
